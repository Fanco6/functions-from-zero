name: Python CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python 3.12 environment
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Optional: Caches dependencies to speed up subsequent runs

    # 3. Install core dependencies, linter, test runner, and formatter
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest black
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Check code formatting with Black (fails if files are not formatted)
    - name: Check formatting with Black
      run: |
        black --check .

    # 5. Lint the codebase with Pylint
    - name: Lint with Pylint
      run: |
        # By default, this will scan all Python files in the repository. 
        # Customize the target directory if needed (e.g., pylint src/)
        pylint $(git ls-files '*.py')

    # 6. Run unit tests with Pytest
    - name: Run tests with Pytest
      run: |
        pytest
