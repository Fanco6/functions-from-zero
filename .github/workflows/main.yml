name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the latest code from your repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Dynamically set up a stable Python environment (using 3.12 as a robust modern baseline)
      # and cache your pip dependencies to save workflow run-time.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Install core tools and any dependencies listed in your project
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest black
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Enforce code quality using Pylint
      - name: Lint with pylint
        run: |
          # Looks for any Python files in your repository and runs linting
          pylint $(git ls-files '*.py')

      # 5. Run automated tests with Pytest
      - name: Test with pytest
        run: |
          pytest

      # 6. Check formatting layout using Black (the industry standard Python formatter)
      - name: Format check with Black
        run: |
          black --check .
